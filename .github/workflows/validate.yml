name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-check:
    name: Platform-Adapter Sync-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify .codex/ and .github/prompts/ are in sync with .claude/
        run: python scripts/sync-platforms.py --check

  pro-variants-check:
    name: Pro-Mode Agent-Variant Drift-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify .claude/agents/*-pro.md are in sync with 1M variants
        run: python scripts/sync-pro-variants.py --check

  pro-mode-toggle-smoke:
    name: Pro-Mode Toggle Smoke-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Roundtrip enable -> status -> disable -> status
        run: |
          set -e
          python scripts/legal-audit-pro-mode.py status --json > /dev/null
          python scripts/legal-audit-pro-mode.py enable
          python scripts/legal-audit-pro-mode.py status --json \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['any_enabled'] is True, 'enable did not flip state'; print('enable OK')"
          python scripts/legal-audit-pro-mode.py disable
          python scripts/legal-audit-pro-mode.py status --json \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['any_enabled'] is False, 'disable did not flip state'; print('disable OK')"
      - name: legal-status surfaces pro_mode block
        run: |
          python scripts/legal-status.py --json \
            | python -c "import sys,json; d=json.load(sys.stdin); pm=d['pro_mode']; assert pm['variants_complete'] is True, 'pro variants missing'; assert pm['enabled'] is False, 'state should be off after smoke'; print('legal-status OK')"

  disclaimer-check:
    name: Disclaimer-Validation (Knowledge Base + Templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify disclaimer in legally-substantive KB files
        run: |
          # Nur in juristisch substantielle Dateien wird Disclaimer-Pflicht durchgesetzt:
          # - gesetze/, themen/, urteile/, behoerden/, checklisten/
          # NICHT in anwaelte-tools/ (Empfehlungslisten) oder tool-katalog.md (Index)
          # NICHT in INDEX.md, README, *-OBSIDIAN.md (Meta-Dateien)
          MISSING=0
          while IFS= read -r f; do
            if ! grep -q "keine Rechtsberatung\|RDG\|§ 2 RDG\|Paragraph 2 RDG" "$f"; then
              echo "MISSING DISCLAIMER: $f"
              MISSING=$((MISSING + 1))
            fi
          done < <(find knowledge/gesetze knowledge/themen knowledge/urteile knowledge/behoerden knowledge/checklisten templates \
              -name "*.md" -type f 2>/dev/null \
              | grep -v "INDEX.md\|README\|tool-katalog.md")
          if [ "$MISSING" -gt 0 ]; then
            echo ""
            echo "FAIL: $MISSING legally-substantive KB files lack disclaimer reference."
            exit 1
          fi
          echo "OK: Disclaimer present in all legally-substantive KB and template files."

  placeholder-scan:
    name: Platzhalter-Scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run placeholder scanner
        run: |
          if [ -f scripts/find-placeholders.py ]; then
            python scripts/find-placeholders.py --json || true
          else
            echo "scripts/find-placeholders.py not found, skipping"
          fi

  markdown-lint:
    name: Markdown-Lint (relaxed)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint Markdown
        run: |
          markdownlint \
            --disable MD013 MD033 MD034 MD041 MD024 MD036 MD040 MD031 MD032 \
            --ignore "node_modules" \
            --ignore "audits/**" \
            "**/*.md" || true
